<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>のおる — works</title>
  <meta name="description" content="映像制作を軸に、幅広く活動中のクリエイター「のおる」の実績一覧です。" />

  <!-- OGP / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://nolqe.github.io/Ivky/works.html" />
  <meta property="og:title" content="のおる — works" />
  <meta property="og:description" content="映像制作を軸に、幅広く活動中のクリエイター「のおる」の実績一覧です。" />
  <meta property="og:image" content="https://nolqe.github.io/Ivky/images/ivky.png" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://nolqe.github.io/Ivky/works.html" />
  <meta name="twitter:title" content="のおる — works" />
  <meta name="twitter:description" content="映像制作を軸に、幅広く活動中のクリエイター「のおる」の実績一覧です。" />
  <meta name="twitter:image" content="https://nolqe.github.io/Ivky/images/ivky.png" />
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=DM+Mono:wght@300;400&family=Playfair+Display:wght@400;500&display=swap");

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #f4f4f2;
      --bg2: #eeeee9;
      --border: #d4d4d0;
      --border2: #e2e2dd;
      --text: #181816;
      --text2: #6a6a65;
      --text3: #b0b0aa;
      --text4: #c8c8c2;
      --serif: "Cormorant Garamond", serif;
      --mono: "DM Mono", monospace;
    }

    html,
    body {
      background: var(--bg);
    }

    body {
      font-family: var(--serif);
      color: var(--text);
      font-size: 15px;
      min-height: 100dvh;
      /* 文字は選べない（index.html と同じ） */
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 999;
      pointer-events: none;
      opacity: 0.028;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 128px 128px;
    }

    /* top bar */
    .top {
      position: sticky;
      top: 0;
      z-index: 10;
      height: 56px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(to bottom, rgba(244, 244, 242, 0.96) 55%, rgba(244, 244, 242, 0) 100%);
    }

    .back {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text2);
      letter-spacing: 0.1em;
      text-decoration: none;
      transition: color 0.2s;
    }

    .back:hover {
      color: var(--text);
    }

    /* list */
    .wrap {
      max-width: 600px;
      margin: 0 auto;
      padding: 40px 16px 96px;
    }

    .sec-head {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--text4);
      letter-spacing: 0.24em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    h1 {
      /* あおぞら明朝 thin は、端末に入っているときだけ効く（配信はしていない。前の配信先は 404 だった）。無ければ Playfair Display と明朝 */
      font-family: 'Aozora Mincho Thin', "Playfair Display", var(--serif);
      font-size: clamp(30px, 6vw, 42px);
      font-weight: 100;
      letter-spacing: 0.043em;
      line-height: 1;
      display: inline-block;
      transform: scaleY(0.86);
      transform-origin: center bottom;
    }

    .count {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text3);
      letter-spacing: 0.12em;
      margin-top: 14px;
    }

    .works {
      list-style: none;
      margin-top: 44px;
    }

    .work {
      padding: 36px 0 40px;
      border-top: 1px solid var(--border2);
    }

    .whead {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
    }

    .wnum,
    .wyear {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.05em;
    }

    .wnum {
      color: var(--text4);
    }

    .wyear {
      color: var(--text3);
    }

    .wname {
      font-size: clamp(19px, 4.4vw, 23px);
      font-weight: 400;
      margin-bottom: 6px;
      letter-spacing: -0.01em;
    }

    .wmeta {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--text4);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin: -2px 0 10px;
    }

    .wdesc {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text2);
      line-height: 1.7;
      font-weight: 300;
      margin-bottom: 12px;
    }

    .wdesc:empty {
      display: none;
    }

    .wtags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 14px;
    }

    .tag {
      font-family: var(--mono);
      font-size: 9.5px;
      color: var(--text3);
      border: 1px solid var(--border2);
      padding: 2px 8px;
      border-radius: 2px;
    }

    .wlinks {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .wlink,
    .wghost {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.06em;
      text-decoration: none;
      padding-bottom: 2px;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      display: inline-block;
    }

    .wlink {
      color: var(--text);
      border-bottom: 1px solid var(--text);
      transition: opacity 0.2s;
    }

    .wlink:hover {
      opacity: 0.45;
    }

    .wghost {
      color: var(--text4);
      border-bottom: 1px solid var(--border);
    }

    .work-img {
      width: 100%;
      height: auto;
      border-radius: 6px;
      display: block;
    }

    .yt {
      aspect-ratio: 16/9;
      width: 100%;
      background: #eae9e5;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .yt.is-disabled {
      cursor: default;
      background: linear-gradient(135deg, #ecebe7, #e4e3df);
    }

    .yt.is-disabled .yt-play {
      border-color: rgba(24, 24, 22, 0.14);
      opacity: 0.5;
    }

    .yt-play {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: transparent;
      border: 1px solid rgba(24, 24, 22, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      transition:
        transform 0.25s,
        background 0.25s,
        border-color 0.25s;
      position: relative;
      z-index: 1;
    }

    .yt:hover .yt-play {
      transform: scale(1.06);
    }

    .yt-play svg {
      margin-left: 2px;
      width: 13px;
      height: 13px;
    }

    .yt-play polygon {
      fill: rgba(24, 24, 22, 0.45);
      transition: fill 0.25s;
    }

    .yt iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 6px;
    }

    .yt.has-img::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.04);
      transition: background 0.3s;
    }

    .yt.has-img:hover::before {
      background: rgba(0, 0, 0, 0);
    }

    .yt.has-img .yt-play {
      border-color: rgba(255, 255, 255, 0.85);
      background: rgba(255, 255, 255, 0.08);
      -webkit-backdrop-filter: blur(2px);
      backdrop-filter: blur(2px);
    }

    .yt.has-img .yt-play polygon {
      fill: rgba(255, 255, 255, 0.95);
    }

    .yt.has-img:hover .yt-play {
      background: rgba(255, 255, 255, 0.22);
      border-color: rgba(255, 255, 255, 1);
    }

    .foot {
      border-top: 1px solid var(--border2);
      padding-top: 28px;
    }
  </style>
</head>

<body>
  <header class="top">
    <a href="./" class="back">← 息吹</a>
  </header>

  <main class="wrap">
    <div class="sec-head">Works</div>
    <h1>実績一覧</h1>
    <div class="count" id="count"></div>
    <ol class="works" id="works"></ol>
    <div class="foot"><a href="./" class="back">← 息吹 に戻る</a></div>
  </main>

  <script src="./works.js"></script>
  <script>
    function esc(s) {
      if (s == null) return "";
      const d = document.createElement("div");
      d.textContent = String(s);
      return d.innerHTML.replace(/\n/g, "<br>");
    }
    function ytB(id, customImg) {
      const c = id ? "yt" : "yt is-disabled";

      let bgStyle = "";
      if (customImg) {
        bgStyle = `style="background-image: url('${esc(customImg)}'); background-size: contain; background-position: center; background-repeat: no-repeat; background-color: transparent;"`;
      } else if (id) {
        bgStyle = `style="background-image: url('https://img.youtube.com/vi/${id}/maxresdefault.jpg'); background-size: cover; background-position: center;"`;
      }

      const classStr = (customImg || id) ? `${c} has-img` : c;
      return `<div class="${classStr}" ${bgStyle} data-yt="${esc(id || '')}" ${id ? 'onclick="loadYT(this)"' : ''}><div class="yt-play"><svg width="12" height="12" viewBox="0 0 14 14" fill="none"><polygon points="3,1 13,7 3,13"/></svg></div></div>`;
    }
    // index.html の work スロットと同じ並び。番号の行に公開年を足している
    function workHTML(w) {
      const year = (w.date || "").slice(0, 4);
      const head = `<div class="whead"><span class="wnum">${String(w.n).padStart(2, '0')}</span>${year ? `<span class="wyear">${esc(year)}</span>` : ""}</div>`;
      const st = w.status ? `<div class="wmeta">${esc(w.status)}</div>` : "";
      const lk = (w.links || []).length > 0 ? `<div class="wlinks">${w.links.map((l) => (l.url ? `<a href="${esc(l.url)}" class="wlink" target="_blank">${esc(l.label)} →</a>` : `<span class="wghost">${esc(l.label)}</span>`)).join("")}</div>` : "";
      const tagsHtml = (w.tags || []).length > 0 ? `<div class="wtags">${w.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : "";

      let mediaHtml = "";
      if (w.ytId) {
        mediaHtml = ytB(w.ytId, w.img);
      } else if (w.img) {
        mediaHtml = `<img src="${esc(w.img)}" class="work-img" loading="lazy">`;
      } else if ("ytId" in w) {
        mediaHtml = ytB("");
      }

      return `<li class="work">${head}<div class="wname">${esc(w.name || "")}</div>${st}<div class="wdesc">${esc(w.desc || "")}</div>${tagsHtml}${mediaHtml}${lk}</li>`;
    }

    const list = sortedWorks();
    document.getElementById("works").innerHTML = list.map(workHTML).join("");

    const years = list.map((w) => (w.date || "").slice(0, 4)).filter(Boolean);
    const span = years.length ? (years[0] === years[years.length - 1] ? years[0] : `${years[years.length - 1]} — ${years[0]}`) : "";
    document.getElementById("count").textContent = `${String(list.length).padStart(2, "0")} works${span ? " · " + span : ""}`;

    window.loadYT = (el) => {
      const id = el.dataset.yt;
      if (!id) return;
      el.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0" allow="autoplay;encrypted-media" allowfullscreen></iframe>`;
    };
  </script>
  <script src="./versions.js"></script>
  <script src="./menu.js"></script>
</body>

</html>
