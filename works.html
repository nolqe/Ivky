<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>のおる — works</title>
  <meta name="description" content="映像制作を軸に、幅広く活動中のクリエイター「のおる」の実績一覧・自主制作と、依頼・相談の案内です。" />

  <!-- OGP / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://nolqe.github.io/Ivky/works.html" />
  <meta property="og:title" content="のおる — works" />
  <meta property="og:description" content="映像制作を軸に、幅広く活動中のクリエイター「のおる」の実績一覧・自主制作と、依頼・相談の案内です。" />
  <meta property="og:image" content="https://nolqe.github.io/Ivky/images/ivky.png" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://nolqe.github.io/Ivky/works.html" />
  <meta name="twitter:title" content="のおる — works" />
  <meta name="twitter:description" content="映像制作を軸に、幅広く活動中のクリエイター「のおる」の実績一覧・自主制作と、依頼・相談の案内です。" />
  <meta name="twitter:image" content="https://nolqe.github.io/Ivky/images/ivky.png" />
  <link rel="stylesheet" href="./list.css" />
</head>

<body>
  <header class="top">
    <a href="./" class="back">← 息吹</a>
  </header>

  <!-- 実績一覧・自主制作・依頼・相談は、一枚の紙に上から続く。右の目盛（scale.js）は .part[data-label] から見出しを拾う -->
  <main class="wrap">
    <section class="part" id="works" data-label="実績一覧">
      <div class="sec-head">Works</div>
      <h1>実績一覧</h1>
      <div class="count" id="works-count"></div>
      <ol class="works" id="works-list"></ol>
    </section>

    <section class="part" id="personal" data-label="自主制作">
      <div class="sec-head">Personal</div>
      <h2 class="title">自主制作</h2>
      <div class="count" id="personal-count"></div>
      <ol class="works" id="personal-list"></ol>
    </section>

    <section class="part" id="request" data-label="依頼・相談">
      <div class="sec-head">Request</div>
      <h2 class="title">依頼・相談</h2>
      <p class="lead" id="lead"></p>

      <section class="sec">
        <div class="sec-head">料金目安</div>
        <div id="price"></div>
      </section>

      <section class="sec">
        <div class="sec-head">連絡先</div>
        <div class="ways" id="ways"></div>
      </section>

      <section class="sec">
        <div class="sec-head">依頼テンプレート（任意）</div>
        <div class="tpl">
          <div class="tpl-body" id="tpl"></div>
          <button class="cbtn" id="copy" type="button">コピーする ↗</button>
        </div>
      </section>
    </section>

    <div class="foot"><a href="./" class="back">← 息吹 に戻る</a></div>
  </main>

  <script src="./works.js"></script>
  <script src="./personal.js"></script>
  <script src="./request.js"></script>
  <script src="./list.js"></script>
  <script>
    renderList(WORKS, "works");
    renderList(PERSONAL, "personal");

    // 依頼・相談（request.js）
    document.getElementById("lead").textContent = CONTACT.lead || "";

    // 料金目安（index.html の price と同じ形）
    document.getElementById("price").innerHTML = PRICE.map((p) =>
      p.isGroup
        ? `<div class="pr-block"><div class="pr-group-name">${esc(p.name)}</div><div class="pr-sub-list">${(p.subs || []).map((s) => `<div class="pr-sub-row"><div class="pr-sub-amt">${esc(s.amount)}</div><div class="pr-sub-desc">${esc(s.desc)}</div></div>`).join("")}</div></div>`
        : `<div class="pr-block"><div class="pr-single-row"><div class="pr-single-name">${esc(p.name)}</div><div class="pr-single-amt">${esc(p.amount)}</div></div></div>`
    ).join("");

    // 連絡先：X の DM を先頭に、Discord とメール
    const ways = [];
    if (CONTACT.dmUrl) ways.push(`<div class="way"><span class="way-k">X</span><a class="way-v" href="${esc(CONTACT.dmUrl)}" target="_blank" rel="noopener">${esc(CONTACT.dmLabel || "DMを送る →")}</a></div>`);
    if (CONTACT.discord) ways.push(`<div class="way"><span class="way-k">Discord</span><span class="way-v">${esc(CONTACT.discord)}</span></div>`);
    if (CONTACT.mail) ways.push(`<div class="way"><span class="way-k">Mail</span><a class="way-v" href="mailto:${esc(CONTACT.mail)}">${esc(CONTACT.mail)}</a></div>`);
    document.getElementById("ways").innerHTML = ways.join("");

    // 依頼テンプレート。コピーされるのは項目名だけ（index.html と同じ）
    const tpl = CONTACT.template || [];
    document.getElementById("tpl").innerHTML = tpl.map((t) => `<div class="tpl-row"><span class="tpl-lbl">${esc(t.label)}</span><span class="tpl-val">${esc(t.ph)}</span></div>`).join("");
    const copy = document.getElementById("copy");
    copy.addEventListener("click", () => {
      navigator.clipboard.writeText(tpl.map((t) => t.label + "：").join("\n")).then(() => {
        copy.textContent = "コピーしました ✓";
        setTimeout(() => (copy.textContent = "コピーする ↗"), 1500);
      });
    });
  </script>
  <script src="./scale.js"></script>
</body>

</html>
