<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>のおる — request</title>
  <meta name="description" content="映像制作を軸に、幅広く活動中のクリエイター「のおる」への依頼・相談の案内です。" />

  <!-- OGP / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://nolqe.github.io/Ivky/request.html" />
  <meta property="og:title" content="のおる — request" />
  <meta property="og:description" content="映像制作を軸に、幅広く活動中のクリエイター「のおる」への依頼・相談の案内です。" />
  <meta property="og:image" content="https://nolqe.github.io/Ivky/images/ivky.png" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://nolqe.github.io/Ivky/request.html" />
  <meta name="twitter:title" content="のおる — request" />
  <meta name="twitter:description" content="映像制作を軸に、幅広く活動中のクリエイター「のおる」への依頼・相談の案内です。" />
  <meta name="twitter:image" content="https://nolqe.github.io/Ivky/images/ivky.png" />
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=DM+Mono:wght@300;400&family=Playfair+Display:wght@400;500&display=swap");

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #f4f4f2;
      --bg2: #eeeee9;
      --border: #d4d4d0;
      --border2: #e2e2dd;
      --text: #181816;
      --text2: #6a6a65;
      --text3: #b0b0aa;
      --text4: #c8c8c2;
      --serif: "Cormorant Garamond", serif;
      --mono: "DM Mono", monospace;
    }

    html,
    body {
      background: var(--bg);
    }

    body {
      font-family: var(--serif);
      color: var(--text);
      font-size: 15px;
      min-height: 100dvh;
      /* 文字は選べない（index.html と同じ。依頼テンプレートはボタンでコピーする） */
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 999;
      pointer-events: none;
      opacity: 0.028;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 128px 128px;
    }

    /* top bar（works.html と同じ） */
    .top {
      position: sticky;
      top: 0;
      z-index: 10;
      height: 56px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(to bottom, rgba(244, 244, 242, 0.96) 55%, rgba(244, 244, 242, 0) 100%);
    }

    .back {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text2);
      letter-spacing: 0.1em;
      text-decoration: none;
      transition: color 0.2s;
    }

    .back:hover {
      color: var(--text);
    }

    .wrap {
      max-width: 600px;
      margin: 0 auto;
      padding: 40px 16px 96px;
    }

    .sec-head {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--text4);
      letter-spacing: 0.24em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    h1 {
      /* あおぞら明朝 thin は、端末に入っているときだけ効く（配信はしていない。前の配信先は 404 だった）。無ければ Playfair Display と明朝 */
      font-family: 'Aozora Mincho Thin', "Playfair Display", var(--serif);
      font-size: clamp(30px, 6vw, 42px);
      font-weight: 100;
      letter-spacing: 0.043em;
      line-height: 1;
      display: inline-block;
      transform: scaleY(0.86);
      transform-origin: center bottom;
    }

    .lead {
      font-size: 15px;
      font-weight: 300;
      color: var(--text2);
      line-height: 1.9;
      white-space: pre-line;
      margin-top: 26px;
    }

    .sec {
      margin-top: 44px;
      padding-top: 30px;
      border-top: 1px solid var(--border2);
    }

    /* 料金目安（index.html の price と同じ並び） */
    .pr-block {
      padding: 12px 0;
      border-bottom: 1px solid var(--border2);
    }

    .pr-block:last-child {
      border-bottom: 0;
    }

    .pr-group-name,
    .pr-single-name {
      font-size: 17px;
      font-weight: 400;
    }

    .pr-group-name {
      margin-bottom: 8px;
    }

    .pr-sub-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .pr-sub-row {
      display: flex;
      align-items: baseline;
      gap: 14px;
      padding-left: 6px;
    }

    .pr-sub-amt,
    .pr-single-amt {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text);
      white-space: nowrap;
    }

    .pr-sub-amt {
      width: 76px;
      flex-shrink: 0;
    }

    .pr-sub-desc {
      font-size: 14px;
      font-weight: 300;
      color: var(--text2);
    }

    .pr-single-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 14px;
    }

    /* 連絡先 */
    .ways {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .way {
      display: flex;
      align-items: baseline;
      gap: 14px;
    }

    .way-k {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--text3);
      letter-spacing: 0.12em;
      width: 76px;
      flex-shrink: 0;
    }

    .way-v {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text);
      letter-spacing: 0.04em;
      word-break: break-all;
    }

    a.way-v {
      text-decoration: none;
      border-bottom: 1px solid var(--text);
      padding-bottom: 1px;
      transition: opacity 0.2s;
    }

    a.way-v:hover {
      opacity: 0.45;
    }

    /* 依頼テンプレート（index.html の Contact と同じ並び） */
    .tpl {
      padding: 18px;
      background: var(--bg2);
      border-radius: 5px;
    }

    .tpl-body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px 18px;
    }

    @media (max-width: 480px) {
      .tpl-body {
        grid-template-columns: 1fr;
        gap: 10px;
      }
    }

    .tpl-row {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .tpl-lbl {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--text);
    }

    .tpl-val {
      font-size: 13px;
      color: var(--text2);
    }

    .cbtn {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text2);
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      margin-top: 16px;
      letter-spacing: 0.08em;
      display: block;
      transition: color 0.2s;
    }

    .cbtn:hover {
      color: var(--text);
    }

    .foot {
      margin-top: 56px;
      border-top: 1px solid var(--border2);
      padding-top: 28px;
    }
  </style>
</head>

<body>
  <header class="top">
    <a href="./" class="back">← 息吹</a>
  </header>

  <main class="wrap">
    <div class="sec-head">Request</div>
    <h1>依頼・相談</h1>
    <p class="lead" id="lead"></p>

    <section class="sec">
      <div class="sec-head">料金目安</div>
      <div id="price"></div>
    </section>

    <section class="sec">
      <div class="sec-head">連絡先</div>
      <div class="ways" id="ways"></div>
    </section>

    <section class="sec">
      <div class="sec-head">依頼テンプレート（任意）</div>
      <div class="tpl">
        <div class="tpl-body" id="tpl"></div>
        <button class="cbtn" id="copy" type="button">コピーする ↗</button>
      </div>
    </section>

    <div class="foot"><a href="./" class="back">← 息吹 に戻る</a></div>
  </main>

  <script src="./request.js"></script>
  <script>
    function esc(s) {
      if (s == null) return "";
      const d = document.createElement("div");
      d.textContent = String(s);
      return d.innerHTML;
    }
    document.getElementById("lead").textContent = CONTACT.lead || "";

    // 料金目安（index.html の price と同じ形）
    document.getElementById("price").innerHTML = PRICE.map((p) =>
      p.isGroup
        ? `<div class="pr-block"><div class="pr-group-name">${esc(p.name)}</div><div class="pr-sub-list">${(p.subs || []).map((s) => `<div class="pr-sub-row"><div class="pr-sub-amt">${esc(s.amount)}</div><div class="pr-sub-desc">${esc(s.desc)}</div></div>`).join("")}</div></div>`
        : `<div class="pr-block"><div class="pr-single-row"><div class="pr-single-name">${esc(p.name)}</div><div class="pr-single-amt">${esc(p.amount)}</div></div></div>`
    ).join("");

    // 連絡先：X の DM を先頭に、Discord とメール
    const ways = [];
    if (CONTACT.dmUrl) ways.push(`<div class="way"><span class="way-k">X</span><a class="way-v" href="${esc(CONTACT.dmUrl)}" target="_blank" rel="noopener">${esc(CONTACT.dmLabel || "DMを送る →")}</a></div>`);
    if (CONTACT.discord) ways.push(`<div class="way"><span class="way-k">Discord</span><span class="way-v">${esc(CONTACT.discord)}</span></div>`);
    if (CONTACT.mail) ways.push(`<div class="way"><span class="way-k">Mail</span><a class="way-v" href="mailto:${esc(CONTACT.mail)}">${esc(CONTACT.mail)}</a></div>`);
    document.getElementById("ways").innerHTML = ways.join("");

    // 依頼テンプレート。コピーされるのは項目名だけ（index.html と同じ）
    const tpl = CONTACT.template || [];
    document.getElementById("tpl").innerHTML = tpl.map((t) => `<div class="tpl-row"><span class="tpl-lbl">${esc(t.label)}</span><span class="tpl-val">${esc(t.ph)}</span></div>`).join("");
    const copy = document.getElementById("copy");
    copy.addEventListener("click", () => {
      navigator.clipboard.writeText(tpl.map((t) => t.label + "：").join("\n")).then(() => {
        copy.textContent = "コピーしました ✓";
        setTimeout(() => (copy.textContent = "コピーする ↗"), 1500);
      });
    });
  </script>
  <script src="./versions.js"></script>
  <script src="./menu.js"></script>
</body>

</html>
