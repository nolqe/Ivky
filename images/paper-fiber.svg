<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- 固定した細かな繊維に斜光を当てる。フィルターはこのタイルだけに使う。 -->
  <filter id="fiber" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.16 0.3" numOctaves="3" seed="17" stitchTiles="stitch" result="height"/>
    <feDiffuseLighting in="height" surfaceScale="0.28" diffuseConstant="1.12" lighting-color="#ffffff" result="light">
      <feDistantLight azimuth="225" elevation="58"/>
    </feDiffuseLighting>
    <feComponentTransfer in="light">
      <feFuncA type="linear" slope="0.05"/>
    </feComponentTransfer>
  </filter>
  <rect width="256" height="256" filter="url(#fiber)"/>
</svg>
